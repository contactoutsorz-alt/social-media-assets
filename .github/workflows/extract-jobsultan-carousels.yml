name: Extract JobSultan carousel slide assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-jobsultan-carousels.yml"
      - "jobsultan/carousels/*.zip"

permissions:
  contents: write

concurrency:
  group: jobsultan-carousel-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract the 60 seven-slide carousels
        run: python3 scripts/extract_jobsultan_carousels.py
      - name: Commit public slide images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobsultan/carousels/published jobsultan/carousels/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish extracted JobSultan carousel slide assets"
            git push origin HEAD:main
          fi
